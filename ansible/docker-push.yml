---
- name: Build and push Docker image using Ansible Vault
  hosts: local
  connection: local

  vars_files:
    - secrets.yml

  tasks:

    - name: Build Docker image
      community.docker.docker_image:
        name: "{{ dockerhub_username }}/ansible-vault-demo"
        tag: latest
        source: build
        build:
          path: ./app
        state: present

    - name: Login to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_token }}"
      no_log: true

    - name: Push Docker image
      community.docker.docker_image:
        name: "{{ dockerhub_username }}/ansible-vault-demo"
        tag: latest
        source: local
        push: true
